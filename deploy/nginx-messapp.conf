# Add the `map` block once inside Nginx's top-level `http {}` block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Mess App: HTTPS virtual host
# Replace the certificate paths and domain name if this server uses different values.
server {
    listen 443 ssl;
    server_name mess.shadiqur.com;

    ssl_certificate     C:/nginx/ssl/shadiqur.com.crt;
    ssl_certificate_key C:/nginx/ssl/shadiqur.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # `npm run build` creates this directory.
    root G:/messapp/web/dist;
    index index.html;
    client_max_body_size 2m;

    # Do not let the SPA fallback mask API 404 responses.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # Cache fingerprinted Vite assets; HTML remains uncached.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

